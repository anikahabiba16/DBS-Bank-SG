    <script>
      // Strict Zero-LocalStorage enforcement:
      // Guarantee zero persistent data in localStorage (clears cuid, tokens, or any third-party keys)
      // All data resides safely in volatile in-memory storage, keeping DevTools Local Storage 100% empty.
      (function() {
        try {
          if (typeof window !== 'undefined' && window.localStorage) {
            var origSetItem = window.Storage.prototype.setItem;
            var origGetItem = window.Storage.prototype.getItem;
            var origRemoveItem = window.Storage.prototype.removeItem;
            var origClear = window.Storage.prototype.clear;
            var origKey = window.Storage.prototype.key;

            // Clear physical storage on initial load
            try { origClear.call(window.localStorage); } catch(e) {}

            var memStore = {};

            window.Storage.prototype.setItem = function(key, val) {
              if (this === window.localStorage) {
                memStore[key] = String(val);
                try { origRemoveItem.call(window.localStorage, key); } catch(e) {}
                return;
              }
              return origSetItem.call(this, key, val);
            };

            window.Storage.prototype.getItem = function(key) {
              if (this === window.localStorage) {
                return Object.prototype.hasOwnProperty.call(memStore, key) ? memStore[key] : null;
              }
              return origGetItem.call(this, key);
            };

            window.Storage.prototype.removeItem = function(key) {
              if (this === window.localStorage) {
                delete memStore[key];
                try { origRemoveItem.call(window.localStorage, key); } catch(e) {}
                return;
              }
              return origRemoveItem.call(this, key);
            };

            window.Storage.prototype.clear = function() {
              if (this === window.localStorage) {
                memStore = {};
                try { origClear.call(window.localStorage); } catch(e) {}
                return;
              }
              return origClear.call(this);
            };

            window.Storage.prototype.key = function(index) {
              if (this === window.localStorage) {
                var keys = Object.keys(memStore);
                return keys[index] || null;
              }
              return origKey.call(this, index);
            };
          }
        } catch(e) {}
      })();
    </script>
    <script>
      // Intercept and redirect 'unload' event listeners to 'pagehide' to prevent Chrome Permissions Policy violation
      (function() {
        try {
          var origAdd = window.addEventListener;
          window.addEventListener = function(type, listener, options) {
            if (type === 'unload') {
              return origAdd.call(window, 'pagehide', listener, options);
            }
            return origAdd.call(window, type, listener, options);
          };
          var origRemove = window.removeEventListener;
          window.removeEventListener = function(type, listener, options) {
            if (type === 'unload') {
              return origRemove.call(window, 'pagehide', listener, options);
            }
            return origRemove.call(window, type, listener, options);
          };
          Object.defineProperty(window, 'onunload', {
            get: function() { return null; },
            set: function(fn) {
              if (typeof fn === 'function') {
                window.addEventListener('pagehide', fn);
              }
            },
            configurable: true
          });
        } catch (e) {
          // ignore
        }
      })();
    </script>
